<!doctype html>
<html lang="sk">

<head>
  <meta charset="UTF-8" />
  <!-- CSP pro APK (Capacitor WebView, origin https://localhost) i web. Musí stát PŘED inline skriptem níž.
       Udržovat shodně s hlavičkou v firebase.json (ta má navíc frame-ancestors, které v meta nefunguje).
       sha256 = hash inline skriptu níž; při jeho změně přepočítat. V dev serveru se meta odstraňuje (vite.config.mjs). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'sha256-sxbfq9EVvurEfU0dLHbCPtafCqEz3Fq2Vb7+E/Wabwg=' https://apis.google.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://*.googleusercontent.com; media-src 'self' blob: https://firebasestorage.googleapis.com; font-src 'self'; connect-src 'self' blob: https://*.googleapis.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://us-central1-meditations-audio.cloudfunctions.net; frame-src https://meditations-audio.firebaseapp.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; worker-src 'self'; manifest-src 'self'">
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4ddc4">
  <link rel="apple-touch-icon" href="/icon-192x192.svg">
  <!-- Fonty se načítají lokálně přes @fontsource (bez Google Fonts) -->
  <title>Meditačná aplikácia</title>
  <style>
    /* Výchozí barva než naběhne script, pokud by selhal */
    html, body { margin: 0; padding: 0; background-color: #f4ddc4; }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #151515; }
    }
  </style>
  <script>
    (function() {
      try {
        var mode = localStorage.getItem('meditation-app-color-mode');
        var themeDark = '#151515';
        var themeLight = '#f4ddc4'; 
        var bg = mode === 'dark' ? themeDark : themeLight;
        
        // Nastavit pozadí okamžitě pro kořenový element
        document.documentElement.style.backgroundColor = bg;
        
        // Vložit CSS pravidlo pro zaručení, že se aplikuje hned na html i body
        var css = 'html, body { background-color: ' + bg + ' !important; margin: 0; padding: 0; }';
        var style = document.createElement('style');
        style.id = 'theme-init-style';
        style.textContent = css;
        document.head.appendChild(style);
        
        // Také dynamicky nastavit theme color meta tag
        var metaThemeColor = document.querySelector('meta[name="theme-color"]');
        if (metaThemeColor) {
          metaThemeColor.setAttribute('content', bg);
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
